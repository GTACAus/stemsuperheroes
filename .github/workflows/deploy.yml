
# =====================================================
# GTAC STEM WEBSITE - GITHUB PAGES DEPLOYMENT
#
# Publishes the CURRENT HTML, CSS and JavaScript.
#
# The old vue-project folder is kept as a backup,
# but is NOT built or published.
# =====================================================

name: Deploy GTAC STEM Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # ================================================
  # BUILD STATIC WEBSITE
  # ================================================

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp ./*.html _site/
          cp -r assets scripts styles _site/

      # Publish HTML website, NOT Vue
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ================================================
  # DEPLOY TO GITHUB PAGES
  # ================================================

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
